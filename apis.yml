description: Primavera Systems, Inc. was a project-management and project-portfolio-management software
  company best known for the Primavera P6 scheduling platform used in construction, engineering, and
  capital-projects industries. It was acquired by Oracle Corporation in 2008 and folded into Oracle's
  Construction and Engineering business, where the products live on as Oracle Primavera. As an
  independent company it no longer exists, its primavera.com domain now redirects to oracle.com/primavera,
  and it publishes no independent public developer API, developer portal, or API documentation of its own.
  This profile was surfaced as an Insight Partners portfolio lead, but that association does not match the
  acquired-by-Oracle entity and appears to be a name-matching artifact.
